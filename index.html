<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Party Time!</title>
  <link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0d0020;
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
      width: 100%; height: 100vh;
    }

    /* ── SCREENS ── */
    .screen {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity 0.7s ease;
      z-index: 1;
    }
    .screen.active { opacity: 1; pointer-events: all; z-index: 10; }

    /* ── WELCOME CARD ── */
    #welcomeScreen { background: #0d1a2e; }

    .welcome-card {
      background: rgba(10,5,20,0.75);
      backdrop-filter: blur(20px);
      border: 2px solid rgba(232,168,48,0.55);
      border-radius: 26px;
      padding: 2.2rem 2rem;
      width: min(420px, 92vw);
      text-align: center;
      box-shadow: 0 0 60px rgba(232,168,48,0.18);
      position: relative; z-index: 2;
    }
    .welcome-card .emoji-top { font-size: 2.8rem; margin-bottom: .4rem; line-height:1; }
    .welcome-card h1 {
      font-family: 'Boogaloo', cursive;
      font-size: clamp(2rem,6vw,2.8rem);
      color: #ffd700;
      text-shadow: 0 0 20px rgba(255,215,0,0.5);
      margin-bottom: .2rem; letter-spacing: 2px;
    }
    .welcome-card .tagline {
      color: #e8c87a; font-size: .9rem;
      letter-spacing: 1px; margin-bottom: 1.8rem;
    }
    .divider {
      display: flex; align-items: center; gap: .8rem; margin-bottom: 1.2rem;
    }
    .divider-line { flex:1; height:1px; background:rgba(232,168,48,0.3); }
    .divider-text { color:#e8a830; font-size:.72rem; letter-spacing:2px; }

    /* Name input */
    .name-input {
      width: 100%; padding: .85rem 1.1rem;
      border-radius: 12px;
      background: rgba(255,255,255,0.07);
      border: 2px solid rgba(232,168,48,0.35);
      color: #fff; font-size: 1.05rem;
      font-family: 'Nunito', sans-serif;
      margin-bottom: 1.2rem; outline: none;
      transition: border-color .2s;
    }
    .name-input::placeholder { color: rgba(255,255,255,0.35); }
    .name-input:focus { border-color: #ffd700; }

    /* Enter button */
    .enter-btn {
      width: 100%; padding: .95rem;
      border-radius: 14px; border: none; cursor: pointer;
      background: linear-gradient(135deg,#e8a830,#ffd700,#c4892a);
      color: #1a0a00; font-family: 'Boogaloo', cursive;
      font-size: 1.3rem; letter-spacing: 1px;
      box-shadow: 0 4px 24px rgba(232,168,48,0.45);
      transition: transform .15s, box-shadow .15s;
    }
    .enter-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(255,215,0,0.55); }

    /* Balloons */
    .balloon-wrap {
      position: absolute; pointer-events: none;
      bottom: -80px; animation: balloonRise linear forwards;
    }
    @keyframes balloonRise {
      0%   { transform: translateY(0); opacity: 0; }
      5%   { opacity: 1; }
      100% { transform: translateY(-110vh); opacity: 0.3; }
    }

    /* ── DOOR SCREEN ── */
    #doorScreen { background: transparent; }
    #palaceSvg  { width: 100%; height: 100%; }

    /* ── PARTY SCREEN ── */
    #bg {
      position: fixed; inset: 0; z-index: 0;
    }
    #content {
      position: relative; z-index: 10;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem;
    }

    h1.party-title {
      font-family: 'Boogaloo', cursive;
      font-size: clamp(3rem, 10vw, 7rem);
      letter-spacing: 4px; color: #fff;
      text-shadow: 0 0 30px #f472b6, 0 0 60px #c084fc;
      animation: titlePop 1s cubic-bezier(.36,1.56,.64,1) both;
      text-align: center;
    }
    p.sub {
      margin-top: 1rem;
      font-size: clamp(1rem, 3vw, 1.4rem);
      color: #e9d5ff; letter-spacing: 2px; text-align: center;
      animation: fadeUp 1.2s 0.3s ease both;
    }
    .btn {
      margin-top: 2.5rem; padding: 1rem 2.8rem;
      background: linear-gradient(135deg, #f472b6, #c084fc);
      color: #fff; font-family: 'Boogaloo', cursive;
      font-size: 1.5rem; letter-spacing: 2px;
      border: none; border-radius: 50px; cursor: pointer;
      box-shadow: 0 4px 30px #f472b699;
      animation: fadeUp 1.2s 0.6s ease both;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover { transform: scale(1.08) translateY(-3px); box-shadow: 0 8px 40px #f472b6cc; }

    /* User tag top-right */
    #userTag {
      position: fixed; top: 1rem; right: 1rem;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px; padding: .35rem .9rem;
      color: #fff; font-size: .85rem;
      display: none; align-items: center; gap: .4rem;
      z-index: 200;
    }

    @keyframes titlePop {
      from { opacity: 0; transform: scale(0.5) rotate(-6deg); }
      to   { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── SVG ANIMATIONS ── */
    @keyframes spin { from{transform:rotate(0deg)}to{transform:rotate(360deg)} }
    @keyframes floatA { 0%,100%{transform:translateY(0px) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)} }
    @keyframes floatB { 0%,100%{transform:translateY(-6px) rotate(2deg)}50%{transform:translateY(8px) rotate(-2deg)} }
    @keyframes floatC { 0%,100%{transform:translateY(4px)}50%{transform:translateY(-10px)} }
    @keyframes rain { 0%{transform:translateY(-30px) rotate(0deg);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0} }
    @keyframes beam1 { 0%,100%{opacity:0.07}33%{opacity:0.22}66%{opacity:0.05} }
    @keyframes beam2 { 0%,100%{opacity:0.14}40%{opacity:0.04}80%{opacity:0.2} }
    @keyframes beam3 { 0%,100%{opacity:0.05}50%{opacity:0.18} }
    @keyframes pop { 0%,100%{transform:scale(1)}50%{transform:scale(1.08)} }
    @keyframes zigzag { 0%,100%{transform:translateX(0)}25%{transform:translateX(8px)}75%{transform:translateX(-8px)} }
    @keyframes starTwinkle { 0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.2;transform:scale(0.6)} }
    @keyframes rainbowShift { 0%{fill:#f472b6}16%{fill:#fb923c}33%{fill:#fbbf24}50%{fill:#4ade80}66%{fill:#38bdf8}83%{fill:#c084fc}100%{fill:#f472b6} }

    .disco-spin { animation: spin 3s linear infinite; transform-origin: 50% 55px; transform-box: fill-box; }
    .ba { animation: floatA 3.2s ease-in-out infinite; }
    .bb { animation: floatB 2.8s ease-in-out infinite; }
    .bc { animation: floatC 3.8s ease-in-out infinite; }
    .c1{animation:rain 4s linear infinite}
    .c2{animation:rain 5s .5s linear infinite}
    .c3{animation:rain 3.5s 1s linear infinite}
    .c4{animation:rain 4.5s 1.7s linear infinite}
    .c5{animation:rain 3.8s .3s linear infinite}
    .c6{animation:rain 5.2s 2.2s linear infinite}
    .c7{animation:rain 4.1s .8s linear infinite}
    .c8{animation:rain 3.6s 2.8s linear infinite}
    .c9{animation:rain 4.8s 1.3s linear infinite}
    .c10{animation:rain 5.5s .1s linear infinite}
    .c11{animation:rain 3.9s 3.1s linear infinite}
    .c12{animation:rain 4.3s 1.9s linear infinite}
    .beam1{animation:beam1 1.3s ease-in-out infinite}
    .beam2{animation:beam2 1.7s ease-in-out infinite}
    .beam3{animation:beam3 2.1s ease-in-out infinite}
    .pop{animation:pop 2s ease-in-out infinite}
    .zz{animation:zigzag 1.6s ease-in-out infinite}
    .tw1{animation:starTwinkle 1.1s ease-in-out infinite;transform-origin:160px 130px;transform-box:fill-box}
    .tw2{animation:starTwinkle 1.7s .4s ease-in-out infinite;transform-origin:490px 115px;transform-box:fill-box}
    .tw3{animation:starTwinkle 1.4s .9s ease-in-out infinite;transform-origin:80px 220px;transform-box:fill-box}
    .tw4{animation:starTwinkle 1.9s .2s ease-in-out infinite;transform-origin:570px 200px;transform-box:fill-box}
    .tw5{animation:starTwinkle 1.2s 1.3s ease-in-out infinite;transform-origin:270px 85px;transform-box:fill-box}
    .tw6{animation:starTwinkle 2s .6s ease-in-out infinite;transform-origin:430px 180px;transform-box:fill-box}
    .rainbow{animation:rainbowShift 2s linear infinite}
  </style>
</head>
<body>

<!-- USER TAG -->
<div id="userTag"></div>

<!-- ══ SCREEN 1: WELCOME ══ -->
<div class="screen active" id="welcomeScreen">

<!-- ══ SCREEN 2: DOOR ══ -->
<div class="screen" id="doorScreen">
<svg id="palaceSvg" viewBox="0 0 680 580" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes tS{0%,100%{opacity:1}50%{opacity:0.1}}
      @keyframes lG{0%,100%{opacity:0.6}50%{opacity:1}}
      @keyframes fW{0%,100%{transform:skewX(0deg)}50%{transform:skewX(-12deg)}}
      .ts{animation:tS 2s ease-in-out infinite}
      .lg{animation:lG 1.5s ease-in-out infinite}
      .fw{animation:fW 1.8s ease-in-out infinite;transform-origin:left center}
    </style>
    <pattern id="jl" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="3" fill="none" stroke="#c9834a" stroke-width="0.8"/>

      <line x1="11" y1="8" x2="16" y2="8" stroke="#c9834a" stroke-width="0.8"/>
      <line x1="8" y1="0" x2="8" y2="5" stroke="#c9834a" stroke-width="0.8"/>
      <line x1="8" y1="11" x2="8" y2="16" stroke="#c9834a" stroke-width="0.8"/>
      <line x1="2" y1="2" x2="5.5" y2="5.5" stroke="#c9834a" stroke-width="0.5"/>
      <line x1="14" y1="2" x2="10.5" y2="5.5" stroke="#c9834a" stroke-width="0.5"/>
      <line x1="10.5" y1="10.5" x2="14" y2="14" stroke="#c9834a" stroke-width="0.5"/>
      <line x1="5.5" y1="10.5" x2="2" y2="14" stroke="#c9834a" stroke-width="0.5"/>
    </pattern>
    <pattern id="st" x="0" y="0" width="60" height="30" patternUnits="userSpaceOnUse">
      <rect width="60" height="30" fill="#8b5e3c"/>

</div><!-- end partyScreen -->

<script>
  let guestName = '';

  // ── BALLOON SPAWNER ──
  const BCOLORS = ['#c41e3a','#e8a830','#ffd700','#c084fc','#f472b6','#38bdf8','#4ade80','#fb923c','#e879f9'];
  let balloonId = 0;
  function spawnBalloon() {
    const container = document.getElementById('balloonContainer');
    if (!container) return;
    const size = 36 + Math.random() * 28;
    const x = 5 + Math.random() * 90;
    const dur = 7 + Math.random() * 8;
    const color = BCOLORS[Math.floor(Math.random() * BCOLORS.length)];
    const wrap = document.createElement('div');
    wrap.className = 'balloon-wrap';
    wrap.style.cssText = `left:${x}%;width:${size}px;animation-duration:${dur}s`;
    wrap.innerHTML = `<svg width="${size}" height="${size*1.4}" viewBox="0 0 60 84">
      <ellipse cx="30" cy="32" rx="28" ry="30" fill="${color}" opacity="0.88"/>
      <ellipse cx="22" cy="20" rx="8" ry="7" fill="rgba(255,255,255,0.28)"/>
      <path d="M30,62 Q34,72 30,82" stroke="${color}" stroke-width="1.8" fill="none"/>
      <polygon points="27,62 33,62 30,68" fill="${color}" opacity="0.7"/>
    </svg>`;
    wrap.addEventListener('animationend', () => wrap.remove());
    container.appendChild(wrap);
  }
  spawnBalloon();
  setInterval(spawnBalloon, 900);

  // ── SCREEN SWITCH ──
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // ── STEP 1: ENTER ──
  function handleEnter() {
    const name = document.getElementById('guestNameInput').value.trim();
    if (!name) {
      document.getElementById('guestNameInput').style.borderColor = '#f87171';
      document.getElementById('guestNameInput').placeholder = 'Naam toh likho! 😊';
      return;
    }
    guestName = name;
    const tag = document.getElementById('userTag');
    tag.innerHTML = `👑 <span>${guestName}</span>`;
    tag.style.display = 'flex';
    showScreen('doorScreen');
  }

  // ── STEP 2: DOOR ──
  function openDoor() {
    const L = document.getElementById('doorLeft');
    const R = document.getElementById('doorRight');
    const hint = document.getElementById('doorHint');
    hint.style.opacity = '0';
    L.style.transition = 'transform 1.1s cubic-bezier(0.4,0,0.2,1)';
    L.style.transform  = 'rotateY(-78deg)';
    R.style.transition = 'transform 1.1s cubic-bezier(0.4,0,0.2,1)';
    R.style.transform  = 'rotateY(78deg)';
    setTimeout(() => {
      document.getElementById('partyTitle').textContent = `Welcome, ${guestName}! 🎉`;
      document.getElementById('partySub').textContent   = `✦  The night is yours!  ✦`;
      showScreen('partyScreen');
    }, 1100);
  }
</script>
