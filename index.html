<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Grand Party</title>
  <link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0020; font-family: 'Nunito', sans-serif; overflow: hidden; width: 100%; height: 100vh; }
    .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.7s ease; z-index: 1; }
    .screen.active { opacity: 1; pointer-events: all; z-index: 10; }
    #welcomeScreen { background: #0d1a2e; }
    .welcome-card { background: rgba(10,5,20,0.75); backdrop-filter: blur(20px); border: 2px solid rgba(232,168,48,0.55); border-radius: 26px; padding: 2.2rem 2rem; width: min(420px, 92vw); text-align: center; box-shadow: 0 0 60px rgba(232,168,48,0.18); position: relative; z-index: 2; }
    .welcome-card .emoji-top { font-size: 2.8rem; margin-bottom: .4rem; line-height:1; }
    .welcome-card h1 { font-family: 'Boogaloo', cursive; font-size: clamp(2rem,6vw,2.8rem); color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.5); margin-bottom: .2rem; letter-spacing: 2px; }
    .welcome-card .tagline { color: #e8c87a; font-size: .9rem; letter-spacing: 1px; margin-bottom: 1.8rem; }
    .divider { display: flex; align-items: center; gap: .8rem; margin-bottom: 1.2rem; }
    .divider-line { flex:1; height:1px; background:rgba(232,168,48,0.3); }
    .divider-text { color:#e8a830; font-size:.72rem; letter-spacing:2px; }
    .name-input { width: 100%; padding: .85rem 1.1rem; border-radius: 12px; background: rgba(255,255,255,0.07); border: 2px solid rgba(232,168,48,0.35); color: #fff; font-size: 1.05rem; font-family: 'Nunito', sans-serif; margin-bottom: 1.2rem; outline: none; transition: border-color .2s; }
    .name-input::placeholder { color: rgba(255,255,255,0.35); }
    .name-input:focus { border-color: #ffd700; }
    .enter-btn { width: 100%; padding: .95rem; border-radius: 14px; border: none; cursor: pointer; background: linear-gradient(135deg,#e8a830,#ffd700,#c4892a); color: #1a0a00; font-family: 'Boogaloo', cursive; font-size: 1.3rem; letter-spacing: 1px; box-shadow: 0 4px 24px rgba(232,168,48,0.45); transition: transform .15s, box-shadow .15s; }
    .enter-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(255,215,0,0.55); }
    .balloon-wrap { position: absolute; pointer-events: none; bottom: -80px; animation: balloonRise linear forwards; }
    @keyframes balloonRise { 0%{transform:translateY(0);opacity:0} 5%{opacity:1} 100%{transform:translateY(-110vh);opacity:0.3} }
    #doorScreen { background: transparent; }
    #palaceSvg { width: 100%; height: 100%; }
    #bg { position: fixed; inset: 0; z-index: 0; }
    #content { position: relative; z-index: 10; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
    h1.party-title { font-family: 'Boogaloo', cursive; font-size: clamp(3rem, 10vw, 7rem); letter-spacing: 4px; color: #fff; text-shadow: 0 0 30px #f472b6, 0 0 60px #c084fc; animation: titlePop 1s cubic-bezier(.36,1.56,.64,1) both; text-align: center; }
    p.sub { margin-top: 1rem; font-size: clamp(1rem, 3vw, 1.4rem); color: #e9d5ff; letter-spacing: 2px; text-align: center; animation: fadeUp 1.2s 0.3s ease both; }
    .btn { margin-top: 2.5rem; padding: 1rem 2.8rem; background: linear-gradient(135deg, #f472b6, #c084fc); color: #fff; font-family: 'Boogaloo', cursive; font-size: 1.5rem; letter-spacing: 2px; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 30px #f472b699; animation: fadeUp 1.2s 0.6s ease both; transition: transform 0.15s, box-shadow 0.15s; }
    .btn:hover { transform: scale(1.08) translateY(-3px); box-shadow: 0 8px 40px #f472b6cc; }
    #userTag { position: fixed; top: 1rem; right: 1rem; background: rgba(255,255,255,0.08); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.15); border-radius: 20px; padding: .35rem .9rem; color: #fff; font-size: .85rem; display: none; align-items: center; gap: .4rem; z-index: 200; }
    @keyframes titlePop { from{opacity:0;transform:scale(0.5) rotate(-6deg)} to{opacity:1;transform:scale(1) rotate(0deg)} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
    @keyframes spin { from{transform:rotate(0deg)}to{transform:rotate(360deg)} }
    @keyframes floatA { 0%,100%{transform:translateY(0px) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)} }
    @keyframes floatB { 0%,100%{transform:translateY(-6px) rotate(2deg)}50%{transform:translateY(8px) rotate(-2deg)} }
    @keyframes floatC { 0%,100%{transform:translateY(4px)}50%{transform:translateY(-10px)} }
    @keyframes rain { 0%{transform:translateY(-30px) rotate(0deg);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0} }
    @keyframes beam1 { 0%,100%{opacity:0.07}33%{opacity:0.22}66%{opacity:0.05} }
    @keyframes beam2 { 0%,100%{opacity:0.14}40%{opacity:0.04}80%{opacity:0.2} }
    @keyframes beam3 { 0%,100%{opacity:0.05}50%{opacity:0.18} }
    @keyframes pop { 0%,100%{transform:scale(1)}50%{transform:scale(1.08)} }
    @keyframes zigzag { 0%,100%{transform:translateX(0)}25%{transform:translateX(8px)}75%{transform:translateX(-8px)} }
    @keyframes starTwinkle { 0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.2;transform:scale(0.6)} }
    @keyframes rainbowShift { 0%{fill:#f472b6}16%{fill:#fb923c}33%{fill:#fbbf24}50%{fill:#4ade80}66%{fill:#38bdf8}83%{fill:#c084fc}100%{fill:#f472b6} }
    .disco-spin { animation: spin 3s linear infinite; transform-origin: 50% 55px; transform-box: fill-box; }
    .ba{animation:floatA 3.2s ease-in-out infinite} .bb{animation:floatB 2.8s ease-in-out infinite} .bc{animation:floatC 3.8s ease-in-out infinite}
    .c1{animation:rain 4s linear infinite} .c2{animation:rain 5s .5s linear infinite} .c3{animation:rain 3.5s 1s linear infinite} .c4{animation:rain 4.5s 1.7s linear infinite} .c5{animation:rain 3.8s .3s linear infinite} .c6{animation:rain 5.2s 2.2s linear infinite} .c7{animation:rain 4.1s .8s linear infinite} .c8{animation:rain 3.6s 2.8s linear infinite} .c9{animation:rain 4.8s 1.3s linear infinite} .c10{animation:rain 5.5s .1s linear infinite} .c11{animation:rain 3.9s 3.1s linear infinite} .c12{animation:rain 4.3s 1.9s linear infinite}
    .beam1{animation:beam1 1.3s ease-in-out infinite} .beam2{animation:beam2 1.7s ease-in-out infinite} .beam3{animation:beam3 2.1s ease-in-out infinite}
    .pop{animation:pop 2s ease-in-out infinite} .zz{animation:zigzag 1.6s ease-in-out infinite}
    .tw1{animation:starTwinkle 1.1s ease-in-out infinite;transform-origin:160px 130px;transform-box:fill-box}
    .tw2{animation:starTwinkle 1.7s .4s ease-in-out infinite;transform-origin:490px 115px;transform-box:fill-box}
    .tw3{animation:starTwinkle 1.4s .9s ease-in-out infinite;transform-origin:80px 220px;transform-box:fill-box}
    .tw4{animation:starTwinkle 1.9s .2s ease-in-out infinite;transform-origin:570px 200px;transform-box:fill-box}
    .tw5{animation:starTwinkle 1.2s 1.3s ease-in-out infinite;transform-origin:270px 85px;transform-box:fill-box}
    .tw6{animation:starTwinkle 2s .6s ease-in-out infinite;transform-origin:430px 180px;transform-box:fill-box}
    .rainbow{animation:rainbowShift 2s linear infinite}

    /* ── ADMIN PANEL ── */
    #adminPanel { display:none; position:fixed; inset:0; background:#0a0a18; z-index:9999; overflow-y:auto; padding:1.5rem; font-family:'Nunito',sans-serif; }
    #adminPanel.open { display:block; }
    .adm-hdr { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; padding-bottom:1rem; border-bottom:1px solid rgba(255,215,0,0.2); }
    .adm-hdr h2 { font-family:'Boogaloo',cursive; color:#ffd700; font-size:1.8rem; margin:0; }
    .adm-btn { border-radius:8px; cursor:pointer; font-size:.85rem; font-family:'Nunito',sans-serif; padding:.4rem 1rem; }
    .adm-close { background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); color:#fff; }
    .adm-clear { background:rgba(248,113,113,0.15); border:1px solid rgba(248,113,113,0.3); color:#f87171; }
    .adm-stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:1rem; margin-bottom:1.5rem; }
    .adm-stat { background:rgba(255,255,255,0.05); border-radius:14px; padding:1rem; text-align:center; border:1px solid rgba(255,215,0,0.2); }
    .adm-stat .num { font-family:'Boogaloo',cursive; font-size:2.2rem; color:#ffd700; line-height:1; }
    .adm-stat .lbl { color:rgba(255,255,255,0.5); font-size:.8rem; margin-top:.3rem; }
    .adm-sec { margin-bottom:1.5rem; }
    .adm-sec h3 { color:#e8a830; font-size:1rem; font-weight:700; margin-bottom:.8rem; letter-spacing:1px; }
    .adm-list { background:rgba(255,255,255,0.03); border-radius:12px; border:1px solid rgba(255,255,255,0.08); overflow:hidden; }
    .adm-row { display:flex; align-items:flex-start; gap:.8rem; padding:.7rem 1rem; border-bottom:1px solid rgba(255,255,255,0.05); }
    .adm-row:last-child { border-bottom:none; }
    .adm-name { color:#fff; font-weight:700; font-size:.9rem; min-width:110px; }
    .adm-time { color:rgba(255,255,255,0.35); font-size:.78rem; min-width:60px; }
    .adm-detail { color:#e9d5ff; font-size:.88rem; flex:1; }
    .adm-empty { color:rgba(255,255,255,0.25); font-size:.85rem; padding:1rem; text-align:center; }
  </style>
</head>

<div id="userTag"></div>

<!-- ══ SCREEN 2: DOOR ══ -->

<svg id="palaceSvg" viewBox="0 0 680 580" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">

  <g fill="#e879f9" opacity="0.7" class="tw1"><circle cx="280" cy="310" r="7"/><line x1="287" y1="310" x2="287" y2="286" stroke="#e879f9" stroke-width="2.5"/><line x1="287" y1="286" x2="302" y2="291" stroke="#e879f9" stroke-width="2.5"/></g>
  <g fill="#38bdf8" opacity="0.7" class="tw4"><circle cx="720" cy="298" r="7"/><line x1="727" y1="298" x2="727" y2="274" stroke="#38bdf8" stroke-width="2.5"/><line x1="727" y1="274" x2="742" y2="279" stroke="#38bdf8" stroke-width="2.5"/></g>
</svg>
  </div>
  <div id="content">
    <h1 class="party-title" id="partyTitle">LET'S PARTY!</h1>
    <p class="sub" id="partySub">✦ &nbsp; THE NIGHT IS YOUNG &nbsp; ✦</p>
    <button class="btn" onclick="this.textContent='🎉 LET\'S GOOO!'">JOIN THE PARTY</button>
  </div>
</div>

<!-- ══ ADMIN PANEL ══ -->
<div id="adminPanel">
  <div class="adm-hdr">
    <h2>👑 Admin Panel</h2>
    <div style="display:flex;gap:.6rem">
      <button class="adm-btn adm-clear" onclick="clearAllData()">🗑 Clear All</button>
      <button class="adm-btn adm-close" onclick="closeAdmin()">✕ Close</button>
    </div>
  </div>
  <div class="adm-stats">
    <div class="adm-stat"><div class="num" id="statGuests">0</div><div class="lbl">Total Guests</div></div>
    <div class="adm-stat"><div class="num" id="statWishes">0</div><div class="lbl">Wishes</div></div>
    <div class="adm-stat"><div class="num" id="statToday">0</div><div class="lbl">Aaj Aaye</div></div>
  </div>
  <div class="adm-sec">
    <h3>👥 Guest Visits</h3>
    <div class="adm-list" id="adminGuestList"></div>
  </div>
  <div class="adm-sec">
    <h3>💌 Birthday Wishes</h3>
    <div class="adm-list" id="adminWishList"></div>
  </div>
  <p style="color:rgba(255,255,255,0.18);font-size:.75rem;text-align:center;margin-top:1.5rem">🔐 Keyboard pe type karo "admin" — panel khulega</p>
</div>

<script>
  let guestName = '';
  let adminSeq = '';

  // ── STORAGE ──
  function saveGuest(name) {
    try {
      const arr = JSON.parse(localStorage.getItem('gp_guests') || '[]');
      arr.push({ name, time: new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}), date: new Date().toLocaleDateString('en-IN') });
      localStorage.setItem('gp_guests', JSON.stringify(arr));
    } catch(e){}
  }
  function saveWish(name, wish) {
    try {
      const arr = JSON.parse(localStorage.getItem('gp_wishes') || '[]');
      arr.push({ name, wish, time: new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}) });
      localStorage.setItem('gp_wishes', JSON.stringify(arr));
    } catch(e){}
  }
  function getGuests() { try{ return JSON.parse(localStorage.getItem('gp_guests')||'[]'); }catch(e){return[];} }
  function getWishes() { try{ return JSON.parse(localStorage.getItem('gp_wishes')||'[]'); }catch(e){return[];} }

  // ── ADMIN KEY: type "admin" anywhere ──
  document.addEventListener('keydown', function(e) {
    adminSeq += e.key.toLowerCase();
    if (adminSeq.length > 8) adminSeq = adminSeq.slice(-8);
    if (adminSeq.includes('admin')) { openAdmin(); adminSeq = ''; }
  });

  function openAdmin() {
    refreshAdmin();
    document.getElementById('adminPanel').classList.add('open');
  }
  function closeAdmin() {
    document.getElementById('adminPanel').classList.remove('open');
  }
  function clearAllData() {
    if (confirm('Saara data delete karna hai?')) {
      localStorage.removeItem('gp_guests');
      localStorage.removeItem('gp_wishes');
      refreshAdmin();
    }
  }
  function refreshAdmin() {
    const guests = getGuests();
    const wishes = getWishes();
    const today  = new Date().toLocaleDateString('en-IN');
    document.getElementById('statGuests').textContent = guests.length;
    document.getElementById('statWishes').textContent = wishes.length;
    document.getElementById('statToday').textContent  = guests.filter(g => g.date === today).length;
    const gl = document.getElementById('adminGuestList');
    gl.innerHTML = guests.length
      ? guests.slice().reverse().map(g=>`<div class="adm-row"><span class="adm-time">${g.time}</span><span class="adm-name">${g.name}</span><span class="adm-detail">${g.date}</span></div>`).join('')
      : '<div class="adm-empty">Abhi koi guest nahi aaya 👀</div>';
    const wl = document.getElementById('adminWishList');
    wl.innerHTML = wishes.length
      ? wishes.slice().reverse().map(w=>`<div class="adm-row"><span class="adm-time">${w.time}</span><span class="adm-name">${w.name}</span><span class="adm-detail">${w.wish}</span></div>`).join('')
      : '<div class="adm-empty">Abhi koi wish nahi 💌</div>';
  }

  // ── BALLOONS ──
  const BCOLS = ['#c41e3a','#e8a830','#ffd700','#c084fc','#f472b6','#38bdf8','#4ade80','#fb923c','#e879f9'];
  function spawnBalloon() {
    const c = document.getElementById('balloonContainer');
    if (!c) return;
    const sz = 36 + Math.random()*28, x = 5 + Math.random()*90, dur = 7 + Math.random()*8;
    const col = BCOLS[Math.floor(Math.random()*BCOLS.length)];
    const w = document.createElement('div');
    w.className = 'balloon-wrap';
    w.style.cssText = `left:${x}%;width:${sz}px;animation-duration:${dur}s`;
    w.innerHTML = `<svg width="${sz}" height="${sz*1.4}" viewBox="0 0 60 84"><ellipse cx="30" cy="32" rx="28" ry="30" fill="${col}" opacity="0.88"/><ellipse cx="22" cy="20" rx="8" ry="7" fill="rgba(255,255,255,0.28)"/><path d="M30,62 Q34,72 30,82" stroke="${col}" stroke-width="1.8" fill="none"/><polygon points="27,62 33,62 30,68" fill="${col}" opacity="0.7"/></svg>`;
    w.addEventListener('animationend', () => w.remove());
    c.appendChild(w);
  }
  spawnBalloon(); setInterval(spawnBalloon, 900);

  // ── SCREEN SWITCH ──
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  // ── ENTER ──
  function handleEnter() {
    const name = document.getElementById('guestNameInput').value.trim();
    if (!name) {
      document.getElementById('guestNameInput').style.borderColor = '#f87171';
      document.getElementById('guestNameInput').placeholder = 'Naam toh likho! 😊';
      return;
    }
    guestName = name;
    saveGuest(name);
    const tag = document.getElementById('userTag');
    tag.innerHTML = `😸 <span>${guestName}</span>`;
    tag.style.display = 'flex';
    showScreen('doorScreen');
  }

  // ── DOOR ──
  function openDoor() {
    const L = document.getElementById('doorLeft');
    const R = document.getElementById('doorRight');
    document.getElementById('doorHint').style.opacity = '0';
    L.style.transition = 'transform 1.1s cubic-bezier(0.4,0,0.2,1)';
    L.style.transform  = 'rotateY(-78deg)';
    R.style.transition = 'transform 1.1s cubic-bezier(0.4,0,0.2,1)';
    R.style.transform  = 'rotateY(78deg)';
    setTimeout(() => {
      document.getElementById('partyTitle').textContent = `Welcome, ${guestName}! 🎉`;
      document.getElementById('partySub').textContent   = `✦  Enjoyyyyyyyyy!  ✦`;
      showScreen('partyScreen');
    }, 1100);
  }

  // ── WISH (for future use) ──
  function submitWish(wish) {
    if (wish && wish.trim()) saveWish(guestName, wish.trim());
  }
</script>
</body>
</html>
