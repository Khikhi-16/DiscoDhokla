<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Grand Party</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0020}
 
/* ── SCREENS ── */
#doorScreen, #partyScreen {
  position:fixed;inset:0;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  transition:opacity 0.8s ease;
}
#partyScreen{opacity:0;pointer-events:none;z-index:1}
#doorScreen{z-index:2}
#partyScreen.show{opacity:1;pointer-events:all}
#doorScreen.hide{opacity:0;pointer-events:none}
 
/* ══════════════════════════════
   PARTY BACKGROUND
══════════════════════════════ */
#partyBg{position:absolute;inset:0;width:100%;height:100%}
 
/* Party CSS Animations */
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes floatA{0%,100%{transform:translateY(0px) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
@keyframes floatB{0%,100%{transform:translateY(-6px) rotate(2deg)}50%{transform:translateY(8px) rotate(-2deg)}}
@keyframes floatC{0%,100%{transform:translateY(4px)}50%{transform:translateY(-10px)}}
@keyframes rain{0%{transform:translateY(-30px) rotate(0deg);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}
@keyframes beam1{0%,100%{opacity:0.07}33%{opacity:0.22}66%{opacity:0.05}}
@keyframes beam2{0%,100%{opacity:0.14}40%{opacity:0.04}80%{opacity:0.2}}
@keyframes beam3{0%,100%{opacity:0.05}50%{opacity:0.18}}
@keyframes pop{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes zigzag{0%,100%{transform:translateX(0)}25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}
@keyframes starTwinkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.2;transform:scale(0.6)}}
@keyframes rainbowShift{0%{fill:#f472b6}16%{fill:#fb923c}33%{fill:#fbbf24}50%{fill:#4ade80}66%{fill:#38bdf8}83%{fill:#c084fc}100%{fill:#f472b6}}
@keyframes titleEntrance{0%{opacity:0;transform:translateY(40px) scale(0.8)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes subtitleEntrance{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:translateY(0)}}
 
.disco-spin{animation:spin 3s linear infinite;transform-origin:50% 55px;transform-box:fill-box}
.ba{animation:floatA 3.2s ease-in-out infinite}
.bb{animation:floatB 2.8s ease-in-out infinite}
.bc{animation:floatC 3.8s ease-in-out infinite}
.c1{animation:rain 4s linear infinite}
.c2{animation:rain 5s .5s linear infinite}
.c3{animation:rain 3.5s 1s linear infinite}
.c4{animation:rain 4.5s 1.7s linear infinite}
.c5{animation:rain 3.8s .3s linear infinite}
.c6{animation:rain 5.2s 2.2s linear infinite}
.c7{animation:rain 4.1s .8s linear infinite}
.c8{animation:rain 3.6s 2.8s linear infinite}
.c9{animation:rain 4.8s 1.3s linear infinite}
.c10{animation:rain 5.5s .1s linear infinite}
.c11{animation:rain 3.9s 3.1s linear infinite}
.c12{animation:rain 4.3s 1.9s linear infinite}
.beam1{animation:beam1 1.3s ease-in-out infinite}
.beam2{animation:beam2 1.7s ease-in-out infinite}
.beam3{animation:beam3 2.1s ease-in-out infinite}
.pop{animation:pop 2s ease-in-out infinite}
.zz{animation:zigzag 1.6s ease-in-out infinite}
.tw1{animation:starTwinkle 1.1s ease-in-out infinite}
.tw2{animation:starTwinkle 1.7s .4s ease-in-out infinite}
.tw3{animation:starTwinkle 1.4s .9s ease-in-out infinite}
.tw4{animation:starTwinkle 1.9s .2s ease-in-out infinite}
.tw5{animation:starTwinkle 1.2s 1.3s ease-in-out infinite}
.tw6{animation:starTwinkle 2s .6s ease-in-out infinite}
.rainbow{animation:rainbowShift 2s linear infinite}
 
/* Party content overlay */
#partyContent{
  position:absolute;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  pointer-events:none;
}
#partyContent h1{
  font-family:'Cinzel Decorative',cursive;
  font-size:clamp(2.5rem,8vw,6rem);
  color:#fff;
  text-shadow:0 0 30px #f472b6,0 0 60px #c084fc;
  letter-spacing:4px;text-align:center;
  animation:titleEntrance 1s 0.3s cubic-bezier(.36,1.56,.64,1) both;
}
#partyContent p{
  margin-top:1rem;
  font-family:'Nunito',sans-serif;
  font-size:clamp(0.9rem,2.5vw,1.3rem);
  color:#e9d5ff;letter-spacing:3px;text-align:center;
  animation:subtitleEntrance 1s 0.7s ease both;
}
 
/* ══════════════════════════════
   DOOR SCREEN
══════════════════════════════ */
#doorScreen{background:#1a0a05}
 
/* Palace SVG door animations */
@keyframes twinkSvg{0%,100%{opacity:1}50%{opacity:0.1}}
@keyframes lampGlow{0%,100%{opacity:0.6}50%{opacity:1}}
@keyframes flagWave{0%,100%{transform:skewX(0deg)}50%{transform:skewX(-12deg)}}
@keyframes shimmerSvg{0%,100%{opacity:0.5}50%{opacity:1}}
.tstar{animation:twinkSvg 2s ease-in-out infinite}
.lamp{animation:lampGlow 1.5s ease-in-out infinite}
.svgflag{animation:flagWave 1.8s ease-in-out infinite;transform-origin:left center}
.shim{animation:shimmerSvg 1.8s ease-in-out infinite}
 
#palaceSvg{width:100%;height:100%;cursor:default}
#doorClickZone{cursor:pointer}
#hintText{transition:opacity 0.4s}
</style>
</head>

<script>
function enterParty() {
  const left = document.getElementById('doorLeft');
  const right = document.getElementById('doorRight');
  const hint = document.getElementById('hintText');
  const doorScreen = document.getElementById('doorScreen');
  const partyScreen = document.getElementById('partyScreen');
 
  hint.style.opacity = '0';
  left.style.transition = 'transform 1.1s cubic-bezier(0.4,0,0.2,1)';
  left.style.transform = 'rotateY(-78deg)';
  right.style.transition = 'transform 1.1s cubic-bezier(0.4,0,0.2,1)';
  right.style.transform = 'rotateY(78deg)';
 
  setTimeout(() => {
    partyScreen.classList.add('show');
    doorScreen.classList.add('hide');
  }, 900);
}
</script>
